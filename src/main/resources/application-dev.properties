spring.application.name=StoryPilot
openai.api.key=${OPENAI_API_KEY}
openai.model=gpt-4o-mini
openai.temperature=0
openai.prompt="#TASK# Convert the provided PRD document \"CONTENT\" into a structured backlog in JSON format containing Epics, Stories, and Tasks. The backlog must follow the SMART story framework for Stories and use Atlassian Document Format (ADF) for descriptions so it is Jira Cloud API-ready. Use placeholder Epic and Story IDs that can later be replaced with real Jira keys. #INSTRUCTION# - Parse the PRD (CONTENT) and extract: * Epics ? high-level goals. Assign them unique placeholder IDs (Epic-1, Epic-2, ?). * Stories ? user-focused requirements following SMART story format. Link them to Epics using EPIC_LINK_FIELD_ID: \"Epic-<n>\". * Tasks ? technical/design execution. Link them to Stories using \"parent\": { \"key\": \"Story-<n>\" }. - Structure the output JSON under a top-level \"issues\" array. - For each issue include: * project.key (default \"SCRUM\" if missing) * summary (short title) * description (ADF JSON object for Jira Cloud ? see Skeleton below) * issuetype.name (\"Epic\", \"Story\", \"Task\") * priority.name (default \"Medium\" if not specified) * labels (keywords from PRD) * customfield_10011 (Epic Name) for Epics * EPIC_LINK_FIELD_ID (Epic Link) for Stories/Tasks * parent.key (for Tasks linked to Stories with placeholder Story ID) * placeholderId (temporary ID for linking) - Always maintain hierarchy: Epics ? Stories ? Tasks. - Ensure valid JSON output (no extra text outside). #SKELETON JSON FORMAT# { \"issues\": [ { \"fields\": { \"project\": { \"key\": \"SCRUM\" }, \"summary\": \"Epic: <Epic Summary>\", \"description\": { \"type\": \"doc\", \"version\": 1, \"content\": [ { \"type\": \"paragraph\", \"content\": [ { \"type\": \"text\", \"text\": \"<Epic Description>\" } ] } ] }, \"issuetype\": { \"name\": \"Epic\" }, \"priority\": { \"name\": \"<Priority: High/Medium/Low>\" }, \"labels\": [\"<label1>\", \"<label2>\"], \"customfield_10011\": \"<Epic Name>\", \"placeholderId\": \"Epic-<n>\" } }, { \"fields\": { \"project\": { \"key\": \"SCRUM\" }, \"summary\": \"Story: <Story Summary>\", \"description\": { \"type\": \"doc\", \"version\": 1, \"content\": [ { \"type\": \"paragraph\", \"content\": [ { \"type\": \"text\", \"text\": \"<SMART description of the story>\" } ] } ] }, \"issuetype\": { \"name\": \"Story\" }, \"priority\": { \"name\": \"<Priority: High/Medium/Low>\" }, \"labels\": [\"<label1>\", \"<label2>\"], \"EPIC_LINK_FIELD_ID\": \"Epic-<n>\", \"placeholderId\": \"Story-<n>\" } }, { \"fields\": { \"project\": { \"key\": \"SCRUM\" }, \"summary\": \"Task: <Task Summary>\", \"description\": { \"type\": \"doc\", \"version\": 1, \"content\": [ { \"type\": \"paragraph\", \"content\": [ { \"type\": \"text\", \"text\": \"<Detailed task description>\" } ] } ] }, \"issuetype\": { \"name\": \"Task\" }, \"priority\": { \"name\": \"<Priority: High/Medium/Low>\" }, \"labels\": [\"<label1>\", \"<label2>\"], \"EPIC_LINK_FIELD_ID\": \"Epic-<n>\", \"parent\": { \"key\": \"Story-<n>\" } } } ] } #DO# - Always generate Epics, Stories, and Tasks hierarchy. - Use SMART story framework for Story descriptions: Specific, Measurable, Achievable, Relevant, Time-bound. - Use placeholder IDs (Epic-1, Story-1) for linking. - Use ADF JSON structure for description. - Include labels from PRD context. - Default missing fields to safe values (\"Medium\" priority, \"SCRUM\" project key). #DON?T# - Don?t output anything outside JSON. - Don?t create Stories/Tasks without linking them to Epics. - Don?t skip SMART story structure in Story descriptions. - Don?t flatten the hierarchy. - Don?t leave Jira-required fields empty. #CONTENT# {content} #ANSWER CONTENT#"

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/storypilot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Connection pool (Hikari - default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=PostgresHikariCP
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

app.dryRun=false
app.defaultIssueType=Story
jira.baseUrl=${JIRA_BASE_URL:https://storycopilot.atlassian.net/}
jira.email=${JIRA_EMAIL:m.ahuja2611@gmail.com}
jira.apiToken=${JIRA_API_TOKEN}
jira.projectKey=${JIRA_PROJECT_KEY:SCRUM}
